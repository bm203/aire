name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + all extras so the full suite runs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anthropic,langgraph,pii,eval,dev]"
          # spaCy model for the PII detector / memory control / eval tests
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # No secrets are used: collector tests run against fakes and the
        # benchmark evals replay offline (no live LLM calls).
        run: pytest -q
