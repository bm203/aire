name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (hash-verified from the lockfile)
        # Install ONLY from the hash-pinned lock: --require-hashes aborts if
        # any artifact's hash doesn't match, so CI tests exactly the locked,
        # audited environment — down to the pinned pip/setuptools themselves.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps          # the local package; deps already locked
          # spaCy model: fetched by spaCy's downloader, not pip — the one
          # un-hashed fetch (see docs/dependency-management.md).
          python -m spacy download en_core_web_sm

      - name: Verify the lockfile is in sync with pyproject.toml
        # A stale lock (deps changed without recompiling) fails here. Flags
        # MUST match how the lock is generated (incl. --allow-unsafe) or the
        # recompile always diffs.
        run: |
          pip-compile --all-extras --generate-hashes --strip-extras --allow-unsafe \
            --output-file=requirements.lock pyproject.toml
          git diff --exit-code requirements.lock

      - name: Audit dependencies for known vulnerabilities
        # A pinned package with a known CVE fails the build — the signal to
        # update (after cooldown) or record a justified exception.
        # --skip-editable skips the local `aire` package (not on PyPI).
        run: pip-audit --skip-editable

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # No secrets are used: collector tests run against fakes and the
        # benchmark evals replay offline (no live LLM calls).
        run: pytest -q
