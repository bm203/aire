[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aire"
version = "0.1.0"
description = "AI Runtime Evidence Engine: observe-only audit evidence collection, policy evaluation, and framework-mapped audit reports for AI applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["ai-governance", "audit", "compliance", "llm", "eu-ai-act", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.26.8",
  "python-ulid>=2.7",
  "pyyaml>=6.0",
  "structlog>=24.1",
  # Policy expressions are CEL (industry-standard, in-process): core, not optional.
  "cel-python>=0.2",
  # Report rendering (HTML via autoescaped templates): core, not optional.
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Collectors are optional so the core stays lean; install what your app uses.
anthropic = ["anthropic>=0.40"]
# Also covers Azure OpenAI (openai.AzureOpenAI shares the chat.completions
# interface). See src/aire/collectors/openai_sdk.py.
openai = ["openai>=1.50"]
# The collector wraps the BaseCheckpointSaver interface, so it works with any
# LangGraph app; only the checkpoint packages are needed, not full langgraph.
langgraph = ["langgraph-checkpoint-sqlite>=2.0"]
pii = ["presidio-analyzer>=2.2"]
# Local, read-only audit dashboard (aire dashboard). jinja2 is already core.
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
examples = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph-checkpoint-sqlite>=2.0",
]
# Evaluation harness (evals/, not shipped in the wheel). AgentDojo is pip-
# installable; AgentLeak data is cloned separately (see evals/README.md).
# agentdojo is capped: the harness pins benchmark suite version "v1.2.1"
# (see evals/agentdojo_eval.py) for reproducible numbers, so the package is
# held to the range that ships it. Bump both together when re-baselining.
eval = ["agentdojo>=0.1.30,<0.2", "presidio-analyzer>=2.2"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  # Supply-chain tooling: pip-tools compiles the hash-pinned lockfile from
  # this file; pip-audit scans it for known vulnerabilities. See
  # docs/dependency-management.md.
  "pip-tools>=7.4",
  "pip-audit>=2.7",
]

[project.scripts]
aire = "aire.cli:app"

[project.urls]
Repository = "https://github.com/bm203/aire"

[tool.hatch.build.targets.wheel]
packages = ["src/aire"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# evals/ is a repo-root package (research harness, not part of the wheel);
# expose it to tests without installing it.
pythonpath = ["."]
